<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Recruiting & Hiring Manager Application · Ready Collect Go</title><script src="./config.js"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f5f5f4;color:#111}.top{height:68px;background:#050505;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 24px}.top a{color:#fff;text-decoration:none;font-weight:800}.wrap{max-width:900px;margin:38px auto;padding:0 18px}.card{background:#fff;border:1px solid #ddd;border-radius:20px;padding:28px;box-shadow:0 18px 55px rgba(0,0,0,.08)}h1{margin:0 0 7px;font-size:28px}.sub{color:#666;margin-bottom:24px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.full{grid-column:1/-1}label{display:block;font-size:12px;font-weight:900;margin-bottom:6px}input,select,textarea{width:100%;padding:12px;border:1px solid #bbb;border-radius:9px;font:inherit;background:#fff}textarea{min-height:110px;resize:vertical}.submit{width:100%;margin-top:20px;padding:14px;border:0;border-radius:10px;background:#000;color:#fff;font-weight:900;font-size:15px;cursor:pointer}.msg{margin-top:14px;font-weight:800;font-size:13px}.ok{color:#087a3e}.err{color:#b42318}@media(max-width:700px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.card{padding:20px}}</style></head><body><div class="top"><b>Ready Collect Go · Careers</b><a href="/">Back to Login</a></div><main class="wrap"><div class="card"><h1>Recruiting & Hiring Manager Application</h1><div class="sub">Remote · Build and maintain our collector workforce</div><div class="grid"><div><label>Full Name *</label><input id="name"></div><div><label>Phone *</label><input id="phone"></div><div><label>Email *</label><input id="email" type="email"></div><div><label>City / State *</label><input id="city"></div><div><label>Years Recruiting Experience *</label><input id="recruitYears" type="number" min="0" step=".5"></div><div><label>Years Collections / Call Center Experience</label><input id="collectionYears" type="number" min="0" step=".5"></div><div><label>Typical Hires Per Month</label><input id="hires" type="number" min="0"></div><div><label>Interviewing Experience? *</label><select id="interview"><option value="">Select</option><option>Yes</option><option>No</option></select></div><div><label>Computer, Headset & Internet Ready? *</label><select id="equipment"><option value="">Select</option><option>Yes</option><option>No</option></select></div><div><label>Availability *</label><input id="availability" placeholder="Mon–Fri, 9 AM–5 PM"></div><div class="full"><label>How would you find and hire 10 productive debt collectors in 30 days? *</label><textarea id="plan"></textarea></div><div class="full"><label>Anything else we should know?</label><textarea id="notes"></textarea></div></div><button id="submit" class="submit">Submit Recruiter Application</button><div id="msg" class="msg"></div></div></main><script>const c=()=>window.CO_PILOT_SUPABASE_CONFIG||{};const val=id=>document.getElementById(id).value.trim();document.getElementById('submit').onclick=async()=>{let b=document.getElementById('submit'),m=document.getElementById('msg'),p={full_name:val('name'),phone:val('phone'),email:val('email').toLowerCase(),city:val('city'),recruiting_experience_years:Number(val('recruitYears')||0),collections_experience_years:Number(val('collectionYears')||0),hires_per_month:Number(val('hires')||0),interview_experience:val('interview')==='Yes',equipment_ready:val('equipment')==='Yes',availability:val('availability'),hiring_plan:val('plan'),notes:val('notes')};m.className='msg';if(!p.full_name||!p.phone||!p.email||!p.city||val('recruitYears')===''||!val('interview')||!val('equipment')||!p.availability||!p.hiring_plan){m.textContent='Please complete all required fields.';m.classList.add('err');return}try{b.disabled=true;b.textContent='Submitting…';let cfg=c(),u=String(cfg.url||'').replace(/\/$/,''),k=cfg.publishableKey;if(!u||!k)throw Error('Application service is not configured.');let r=await fetch(u+'/rest/v1/recruiter_applications',{method:'POST',headers:{apikey:k,'Content-Type':'application/json',Prefer:'return=minimal'},body:JSON.stringify(p)});if(!r.ok){let x=await r.json().catch(()=>({}));throw Error(x.message||'Application could not be submitted.')}m.textContent='Application received. If selected, Ready Collect Go will contact you for an interview.';m.classList.add('ok');b.textContent='Application Submitted'}catch(e){m.textContent=e.message||String(e);m.classList.add('err');b.disabled=false;b.textContent='Submit Recruiter Application'}};</script></body></html>
