<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>ReadyCollectGo · Change Password</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f5f4;color:#111;font-family:Arial,Helvetica,sans-serif}.top{height:72px;background:#050505;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 28px}.top a{background:#fff;color:#111;text-decoration:none;border-radius:9px;padding:10px 14px;font-weight:800}.wrap{max-width:560px;margin:48px auto;padding:0 20px}.card{background:#fff;border:1px solid #ddd;border-radius:18px;padding:28px;box-shadow:0 12px 36px rgba(0,0,0,.06)}h1{font-size:24px;margin:0 0 6px}p{color:#666;margin:0 0 22px;font-size:13px}label{display:block;margin:14px 0 6px;font-size:12px;font-weight:900}input{width:100%;padding:12px;border:1px solid #bbb;border-radius:9px;font-size:14px}button{width:100%;margin-top:20px;background:#000;color:#fff;border:0;border-radius:10px;padding:13px;font-weight:900;cursor:pointer}.msg{margin-top:12px;font-size:12px;font-weight:800}.err{color:#b42318}.ok{color:#087a3e}
</style></head><body><div class="top"><b>ReadyCollectGo · Security</b><a href="/">Back to App</a></div><main class="wrap"><section class="card"><h1>Change Password</h1><p>This page uses your existing signed-in ReadyCollectGo session. No recovery email is required.</p><label>New Password</label><input id="pw1" type="password" autocomplete="new-password"><label>Confirm New Password</label><input id="pw2" type="password" autocomplete="new-password"><button id="save" type="button">Change Password</button><div id="msg" class="msg"></div></section></main><script>
(function(){
 const APP_CONFIG=(window.__APP_CONFIG__||window.CO_PILOT_SUPABASE_CONFIG||{}),PROJECT=String(APP_CONFIG.url||'').replace(/\/$/,''),KEY=APP_CONFIG.publishableKey||'', TOKEN_KEY='coPilotSupabaseAccessToken';
 const $=id=>document.getElementById(id), msg=(t,c)=>{const m=$('msg');m.textContent=t;m.className='msg '+(c||'')};
 $('save').addEventListener('click',async()=>{
   const a=$('pw1').value,b=$('pw2').value,token=localStorage.getItem(TOKEN_KEY)||'';
   if(!token)return msg('Your ReadyCollectGo session was not found. Go back to the app, sign in, then return here.','err');
   if(a.length<8)return msg('Password must be at least 8 characters.','err');
   if(a!==b)return msg('Passwords do not match.','err');
   $('save').disabled=true;msg('Updating password…','');
   try{const r=await fetch(PROJECT+'/auth/v1/user',{method:'PUT',headers:{apikey:(window.RCG_PUBLISHABLE_KEY||''),'Authorization':'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify({password:a})});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.msg||d.message||d.error_description||d.error||'Password update failed.');msg('Password changed successfully.','ok');$('pw1').value='';$('pw2').value=''}catch(e){msg(e.message||String(e),'err')}finally{$('save').disabled=false}
 });
})();
</script><script src="./config.js"></script><script>
(function(){const c=window.CO_PILOT_SUPABASE_CONFIG||{};window.RCG_PUBLISHABLE_KEY=c.publishableKey||'';})();
</script></body></html>
