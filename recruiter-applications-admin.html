<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Recruiter Applications | Ready Collect Go</title><script src="./config.js"></script><style>*{box-sizing:border-box}body{margin:0;background:#f5f5f5;color:#111;font-family:Arial,sans-serif}.wrap{max-width:1100px;margin:0 auto;padding:28px 20px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:22px}.top h1{margin:0;font-size:30px}.sub{color:#666;margin-top:5px}.btn,button,select{border:0;border-radius:10px;padding:11px 15px;font-weight:800}.btn,button{background:#000;color:#fff;cursor:pointer;text-decoration:none}.toolbar{display:flex;gap:10px;margin-bottom:16px}.toolbar select{background:#fff;border:1px solid #ddd}.card{background:#fff;border:1px solid #ddd;border-radius:16px;padding:18px;margin-bottom:14px}.head{display:flex;justify-content:space-between;gap:12px}.name{font-size:20px;font-weight:900}.meta{color:#666;margin-top:4px}.status{font-size:12px;font-weight:900;text-transform:uppercase}.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0}.fact,.notes{background:#f6f6f6;border-radius:10px;padding:11px}.notes{margin-top:10px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.actions .reject{background:#b42318}.error{background:#fff0f0;color:#b42318;padding:14px;border-radius:10px;font-weight:800}.empty{background:#fff;padding:25px;border-radius:14px;color:#666}@media(max-width:700px){.facts{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}</style></head><body><div class="wrap"><div class="top"><div><h1>Recruiter Applications</h1><div class="sub">Review, interview and approve Recruiting & Hiring Manager candidates.</div></div><a class="btn" href="/">Back to Collections Manager</a></div><div class="toolbar"><select id="filter"><option value="">All Applications</option><option value="new">New</option><option value="reviewing">Reviewing</option><option value="interview">Interview</option><option value="approved">Approved</option><option value="rejected">Rejected</option></select><button id="refresh">Refresh</button></div><div id="list" class="empty">Loading recruiter applications…</div></div><script>const SUPABASE='https://bwvufgzbkaymffwxuuzr.supabase.co',KEY=(window.__APP_CONFIG__||{}).publishableKey||'sb_publishable_cvwkN3fOovsYvAvzXvrmRA_TKauXT_d',TOKEN_KEY='coPilotSupabaseAccessToken';const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function token(){return localStorage.getItem(TOKEN_KEY)||''}async function api(path,opt={}){let r=await fetch(SUPABASE+'/rest/v1/'+path,{...opt,headers:{apikey:KEY,Authorization:'Bearer '+token(),'Content-Type':'application/json',Prefer:'return=minimal',...(opt.headers||{})}});if(!r.ok){let x=await r.json().catch(()=>({}));throw new Error(x.message||'Request failed ('+r.status+')')}return r.status===204?null:r.json()}async function load(){let box=document.getElementById('list'),f=document.getElementById('filter').value;box.className='empty';box.textContent='Loading recruiter applications…';if(!token()){box.className='error';box.textContent='Your Ready Collect Go session is missing. Return to the app and sign in as Admin.';return}try{let rows=await api('recruiter_applications?select=*&order=created_at.desc'+(f?'&status=eq.'+encodeURIComponent(f):''));box.className='';box.innerHTML=rows.length?rows.map(r=>`<div class="card"><div class="head"><div><div class="name">${esc(r.full_name)}</div><div class="meta">${esc(r.email)} · ${esc(r.phone)} · ${esc(r.city)}</div></div><div class="status">${esc(r.status)}</div></div><div class="facts"><div class="fact"><b>Recruiting</b><br>${esc(r.recruiting_experience_years)} years</div><div class="fact"><b>Collections</b><br>${esc(r.collections_experience_years)} years</div><div class="fact"><b>Hires/month</b><br>${esc(r.hires_per_month)}</div><div class="fact"><b>Interviewing</b><br>${r.interview_experience?'Yes':'No'}</div><div class="fact"><b>Equipment</b><br>${r.equipment_ready?'Ready':'No'}</div><div class="fact"><b>Availability</b><br>${esc(r.availability)}</div></div><div class="notes"><b>30-day hiring plan:</b> ${esc(r.hiring_plan)}</div>${r.notes?`<div class="notes"><b>Notes:</b> ${esc(r.notes)}</div>`:''}<div class="actions"><button onclick="setStatus('${r.id}','reviewing')">Reviewing</button><button onclick="setStatus('${r.id}','interview')">Interview</button><button onclick="approveRecruiter('${r.id}','${esc(r.email)}')">Approve Recruiter</button><button class="reject" onclick="setStatus('${r.id}','rejected')">Reject</button></div></div>`).join(''):'<div class="empty">No recruiter applications found.</div>'}catch(e){box.className='error';box.textContent='Could not load recruiter applications: '+e.message}}async function setStatus(id,status){try{await api('recruiter_applications?id=eq.'+encodeURIComponent(id),{method:'PATCH',body:JSON.stringify({status,reviewed_at:new Date().toISOString(),reviewed_by_email:'',updated_at:new Date().toISOString()})});await load()}catch(e){alert(e.message)}}async function approveRecruiter(id,email){if(!confirm('Approve '+email+' as a recruiter?'))return;try{await setStatus(id,'approved');alert('Recruiter approved. Next, send this recruiter an account invitation from Supabase Authentication > Users > Add user > Send invitation using '+email+'. Their invite should redirect to https://readycollectgo.com/recruiter-setup.html so they can create a password.')}catch(e){alert(e.message||e)}}document.getElementById('filter').onchange=load;document.getElementById('refresh').onclick=load;load();</script></body></html>
