name: Co Pilot Collector API V7 - Qualified Transfer
description: Identity-gated synthetic collector pathway. Debt context is unavailable until server verification succeeds.
nodes:
  Confirm Intended Person:
    id: 023e1913-021a-4e92-adfd-a12e4f5c3004
    position:
      x: 300
      y: 50
    is_start: true
    type: Default
    prompt: Ask only whether you are speaking with {{first_name}}. Do not state why you are calling or reveal debt
      information. If they clearly confirm, ask only for their 5-digit mailing ZIP code. Never ask for DOB, SSN, street
      address, phone, bank/card data, passwords, PINs, or security answers. Once exactly five ZIP digits are provided,
      stop speaking so the pathway can perform server verification. If they do not clearly confirm they are
      {{first_name}}, end safely.
    condition: The condition is met after you receive the caller response containing the requested mailing ZIP code.
    condition_examples:
      - user: "33601"
        matches: true
        reasoning: The caller provided the requested 5-digit mailing ZIP code.
      - user: "Three three six zero one"
        matches: true
        reasoning: The caller provided the requested 5-digit mailing ZIP code verbally.
      - user: "Yes, this is Jordan"
        matches: false
        reasoning: Identity was confirmed but the requested mailing ZIP has not been provided yet.
    pathway_examples:
      - user: "33601"
        target: Collect Mailing ZIP
        reasoning: The caller provided the requested mailing ZIP and verification must run now.
      - user: "Three three six zero one"
        target: Collect Mailing ZIP
        reasoning: The caller provided the requested mailing ZIP verbally and verification must run now.
    extract_variables:
      - name: mailing_zip_code
        type: string
        description: Exactly the 5-digit mailing ZIP code stated by the confirmed intended person.
    edges:
      - target: Collect Mailing ZIP
        id: reactflow__edge-023e1913-021a-4e92-adfd-a12e4f5c3004-Collect Mailing ZIP
        label: Intended person confirmed and ZIP collected
      - target: Safe End
        id: reactflow__edge-023e1913-021a-4e92-adfd-a12e4f5c3004-Safe End
        label: Identity not confirmed
  Collect Mailing ZIP:
    id: 625b9e3f-b722-456a-82de-a5bf796c407e
    position:
      x: 300
      y: 270
    type: Webhook
    model_options:
      skip_user_response: true
    passthrough:
      url: https://bwvufgzbkaymffwxuuzr.supabase.co/functions/v1/bland-verify-identity
      body:
        attempt_id: "{{attempt_id}}"
        mailing_zip_code: "{{mailing_zip_code}}"
        verification_token: "{{verification_token}}"
      method: POST
      headers:
        Content-Type: application/json
      responseData:
        - data: $.verified
          name: identity_verified
        - data: $.locked
          name: identity_locked
        - data: $.remaining_attempts
          name: remaining_attempts
        - data: $.authorized
          name: context_authorized
        - data: $.disclosure
          name: disclosure
        - data: $.first_name
          name: verified_first_name
        - data: $.original_creditor
          name: original_creditor
        - data: $.debt_type
          name: debt_type
        - data: $.current_balance
          name: current_balance
        - data: $.conversation_policy
          name: conversation_policy
        - data: $.instructions
          name: collector_instructions
      responsePathways:
        - outcome:
            id: 084863c4-cd08-4a03-89b7-7db7a04019af
            node_name: Collector Conversation
          condition:
            value: true
            variable: identity_verified
            condition: ==
        - outcome:
            id: ed11db0a-c92e-4d71-bec4-b54c74d5fcbb
            node_name: Safe End
          condition:
            value: true
            variable: identity_locked
            condition: ==
    edges:
      - target: Retry Mailing ZIP
        id: reactflow__edge-625b9e3f-b722-456a-82de-a5bf796c407e-Retry Mailing ZIP
        label: Verification failed but retry allowed
      - target: Safe End
        id: reactflow__edge-625b9e3f-b722-456a-82de-a5bf796c407e-Safe End
        label: Verification locked or failed closed
      - target: Collector Conversation
        id: reactflow__edge-625b9e3f-b722-456a-82de-a5bf796c407e-Get Verified Context
        label: Identity verified
  Retry Mailing ZIP:
    id: 27af0488-ba45-4445-8b12-fbf8c87d01dd
    position:
      x: 300
      y: 490
    type: Default
    prompt: Say you could not verify that ZIP and can try once more. Ask only for the 5-digit mailing ZIP one final time. Do
      not reveal why you are calling. Never request any substitute identity factor. Once exactly five digits are
      provided, stop speaking so the pathway can perform the final server verification.
    condition: Met when exactly five digits have been provided for the final ZIP attempt.
    extract_variables:
      - name: mailing_zip_code
        type: string
        description: Exactly the final 5-digit mailing ZIP code stated by the consumer.
    edges:
      - target: Verify Retry Identity
        id: reactflow__edge-27af0488-ba45-4445-8b12-fbf8c87d01dd-Verify Retry Identity
        label: Final ZIP collected
  Verify Retry Identity:
    id: 14d98bb9-660a-4c60-bb48-863508d7ab20
    position:
      x: 300
      y: 600
    type: Webhook
    model_options:
      skip_user_response: true
    passthrough:
      url: https://bwvufgzbkaymffwxuuzr.supabase.co/functions/v1/bland-verify-identity
      body:
        attempt_id: "{{attempt_id}}"
        mailing_zip_code: "{{mailing_zip_code}}"
        verification_token: "{{verification_token}}"
      method: POST
      headers:
        Content-Type: application/json
      responseData:
        - data: $.verified
          name: identity_verified
        - data: $.locked
          name: identity_locked
        - data: $.remaining_attempts
          name: remaining_attempts
        - data: $.authorized
          name: context_authorized
        - data: $.disclosure
          name: disclosure
        - data: $.first_name
          name: verified_first_name
        - data: $.original_creditor
          name: original_creditor
        - data: $.debt_type
          name: debt_type
        - data: $.current_balance
          name: current_balance
        - data: $.conversation_policy
          name: conversation_policy
        - data: $.instructions
          name: collector_instructions
      responsePathways:
        - outcome:
            id: 084863c4-cd08-4a03-89b7-7db7a04019af
            node_name: Collector Conversation
          condition:
            value: true
            variable: identity_verified
            condition: ==
        - outcome:
            id: ed11db0a-c92e-4d71-bec4-b54c74d5fcbb
            node_name: Safe End
          condition:
            value: true
            variable: identity_locked
            condition: ==
    edges:
      - target: Safe End
        id: reactflow__edge-14d98bb9-660a-4c60-bb48-863508d7ab20-Safe End
        label: Final verification failed or did not explicitly pass
      - target: Collector Conversation
        id: reactflow__edge-14d98bb9-660a-4c60-bb48-863508d7ab20-Get Verified Context
        label: Final identity verification passed
  Get Verified Context:
    id: fc4035ab-e5e4-4324-8219-e7e7e0926504
    position:
      x: 300
      y: 710
    type: Webhook
    model_options:
      skip_user_response: true
    passthrough:
      url: https://bwvufgzbkaymffwxuuzr.supabase.co/functions/v1/bland-verified-context
      body:
        attempt_id: "{{attempt_id}}"
        verification_token: "{{verification_token}}"
      method: POST
      headers:
        Content-Type: application/json
      responseData:
        - data: $.authorized
          name: context_authorized
        - data: $.disclosure
          name: disclosure
        - data: $.first_name
          name: verified_first_name
        - data: $.original_creditor
          name: original_creditor
        - data: $.debt_type
          name: debt_type
        - data: $.current_balance
          name: current_balance
        - data: $.conversation_policy
          name: conversation_policy
        - data: $.instructions
          name: collector_instructions
      responsePathways:
        - outcome:
            id: 084863c4-cd08-4a03-89b7-7db7a04019af
            node_name: Collector Conversation
          condition:
            value: true
            variable: context_authorized
            condition: ==
    edges:
      - target: Safe End
        id: reactflow__edge-fc4035ab-e5e4-4324-8219-e7e7e0926504-Safe End
        label: Context not explicitly authorized
      - target: Collector Conversation
        id: reactflow__edge-fc4035ab-e5e4-4324-8219-e7e7e0926504-Collector Conversation
        label: Context authorized
  Collector Conversation:
    id: 084863c4-cd08-4a03-89b7-7db7a04019af
    position:
      x: 300
      y: 1150
    type: Default
    prompt: "Before discussing any account information, check the conversation history. If {{disclosure}} has not yet been
      spoken in full since entering this authorized collector stage, your entire next response must be exactly
      {{disclosure}} and nothing else. Only after that disclosure has been spoken may you discuss the verified server
      context: creditor {{original_creditor}}, debt type {{debt_type}}, and current balance {{current_balance}}. Then
      use a short, respectful resolution pitch: explain that the purpose of the call is to see whether there may be a
      workable way to resolve the account, and ask whether the consumer is open to discussing options. Do not pressure,
      threaten, shame, claim urgency, invent consequences, or promise any particular settlement or payment terms. If the
      consumer shows interest in a payment arrangement, payoff, settlement discussion, or other resolution, ask: Would
      you like me to connect you with a resolution specialist who can discuss the available options with you? If they
      say yes, treat that as human_requested and initiate the configured live transfer. Never collect card, bank,
      routing, or other payment credentials. Follow {{conversation_policy}} and {{collector_instructions}} exactly. A
      dispute, stop-calling request, wrong number, already-paid claim, bankruptcy/attorney statement, or uncertainty
      must not be pitched or transferred as a sales lead; capture the appropriate outcome for human review and stop
      collection discussion."
    condition: Met when conversation_outcome has one allowed outcome value. For positive resolution interest, ask permission
      to transfer before setting human_requested.
    extract_variables:
      - name: conversation_outcome
        type: string
        description: One of dispute, stop_calling, callback_request, payment_plan_interest, settlement_request, already_paid,
          cannot_pay, human_requested, wrong_number, conversation_note. Use human_requested only after the consumer
          explicitly agrees to speak with a resolution specialist or directly asks for a human.
      - name: outcome_detail
        type: string
        description: Minimal non-sensitive detail needed for human review; never payment credentials or identity secrets.
    edges:
      - target: Record Outcome
        id: reactflow__edge-084863c4-cd08-4a03-89b7-7db7a04019af-Record Outcome
        label: Outcome captured
  Record Outcome:
    id: bdc98372-c868-4eb1-b98a-b70041062d80
    position:
      x: 700
      y: 50
    type: Webhook
    passthrough:
      url: https://bwvufgzbkaymffwxuuzr.supabase.co/functions/v1/bland-conversation-outcome
      body:
        attempt_id: "{{attempt_id}}"
        event_type: "{{conversation_outcome}}"
        event_payload:
          note: "{{outcome_detail}}"
        verification_token: "{{verification_token}}"
      method: POST
      headers:
        Content-Type: application/json
      responseData:
        - data: $.accepted
          name: outcome_accepted
        - data: $.requires_human_review
          name: requires_human_review
    edges:
      - target: Safe End
        id: reactflow__edge-bdc98372-c868-4eb1-b98a-b70041062d80-Safe End
        label: Outcome recorded or failed closed
  Safe End:
    id: ed11db0a-c92e-4d71-bec4-b54c74d5fcbb
    position:
      x: 700
      y: 270
    type: Default
    prompt: End politely and briefly. If identity or context authorization did not succeed, do not mention debt,
      collections, creditor, balance, account, or reason for the call. If identity was verified, do not add new account
      facts or promises.
global:
  prompt: Keep every response brief, professional, and suitable for a phone call. Never request or collect Social Security
    numbers, dates of birth, bank account numbers, routing numbers, debit or credit card numbers, passwords, PINs, or
    security answers. Never invent creditor, balance, debt, settlement, payment, legal, or credit-reporting facts.
    Before server identity verification succeeds, never disclose a creditor, debt type, balance, account number,
    collection purpose, or any debt-specific information.
